# EPIChem — local development stack.
#
#     docker compose up
#
# and nothing else. Every variable below has a default, so this works on a
# clean clone with no .env file, no exported variables and no arguments. Copy
# .env.example to .env only when you want to change something.
#
# What comes up, in order:
#
#     db  ->  api  ->  web
#     redis -> station-sim        (a Bluesky station pod, see docs/BLUESKY.md)
#
# `api` creates its own tables on boot (no migration tool yet — see
# docs/PROJECT_HISTORY.md's "no Alembic yet" decision) and there is no seed
# step: nothing writes example data into a fresh database yet. See the
# Roadmap's CLI section for the planned approach (seed via real API calls),
# and `scripts/generate_seed.py` for the local-dev stand-in.
#
# Because there are no migrations, a schema change means an existing db-data
# volume is stale: `docker compose down -v` and start again.
#
# Production is a different file: compose.prod.yaml. This one bind-mounts
# source, runs Vite and uvicorn --reload, and defaults to an open API. Do not
# deploy it.

name: epichem

services:
  # ------------------------------------------------------------------ db
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-epichem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-epichem}
      POSTGRES_DB: ${POSTGRES_DB:-epichem}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Exposed so you can psql into it from the host. Bound to localhost only.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # -d matters: without it pg_isready checks the default database, which
      # reports ready slightly before ours exists on first boot.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-epichem} -d ${POSTGRES_DB:-epichem}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ----------------------------------------------------------------- api
  api:
    build:
      context: ./backend
      target: dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-epichem}:${POSTGRES_PASSWORD:-epichem}@db:5432/${POSTGRES_DB:-epichem}
      # Sent as `Authorization: ApiKey ...` to every station's queueserver
      # HTTP server. Must match the pods' QSERVER_HTTP_SERVER_SINGLE_USER_API_KEY.
      EPICHEM_QSERVER_API_KEY: ${EPICHEM_QSERVER_API_KEY:-epichemdevkey}
    volumes:
      # Bind mount + editable install in the image = uvicorn --reload picks up
      # edits made on the host.
      - ./backend:/app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ------------------------------------------------------- station pod
  # A simulated Bluesky station: bluesky-queueserver (RE Manager + worker) and
  # bluesky-httpserver in one container, its Redis beside it. Point a Station's
  # "Queueserver URL" at http://station-sim:60610 to dispatch workflows to it.
  # Build your own from ./bluesky -- see docs/BLUESKY.md.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  station-sim:
    build: ./bluesky
    depends_on:
      - redis
    environment:
      REDIS_ADDR: redis:6379
      QSERVER_HTTP_SERVER_SINGLE_USER_API_KEY: ${EPICHEM_QSERVER_API_KEY:-epichemdevkey}
      EPICHEM_SIM_SPEED: ${EPICHEM_SIM_SPEED:-10}
    volumes:
      # Edit plans/devices on the host, `docker compose restart station-sim`.
      - ./bluesky/startup:/pod/startup
      - ./bluesky/epichem_sim:/pod/epichem_sim
    ports:
      - "127.0.0.1:${STATION_SIM_PORT:-60610}:60610"

  # ---------------------------------------------------------------- seed
  # Optional, local dev only. Creates an admin user (admin/12345678) + one
  # site, two labs, one station via scripts/generate_seed.py -- see
  # scripts/README.md for what it does and its abort-if-admin-exists caveat.
  # Uncomment and run: docker compose run --rm seed
  # seed:
  #   build:
  #     context: ./backend
  #     target: dev
  #   depends_on:
  #     api:
  #       condition: service_healthy
  #   environment:
  #     API_BASE_URL: http://api:8000
  #   volumes:
  #     - ./scripts:/scripts:ro
  #   command: ["python", "/scripts/generate_seed.py"]

  # ----------------------------------------------------------------- web
  web:
    build:
      context: ./frontend
      target: dev
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Vite proxies /api here, so the browser only ever sees one origin and
      # no CORS configuration is needed — same arrangement as running Vite
      # directly on the host, just with a service name instead of 127.0.0.1.
      EPICHEM_API_URL: http://api:8000
      # Bind-mounted source doesn't produce reliable inotify events on macOS
      # or Windows. Harmless on Linux, just a little CPU.
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    volumes:
      - ./frontend:/app
      # Keeps the image's node_modules from being hidden by the bind mount
      # above. NOTE: this volume is populated once, so after changing
      # package.json run `docker compose down -v` (or `docker volume rm
      # epichem_web-node-modules`) to pick up new dependencies.
      - web-node-modules:/app/node_modules
    ports:
      - "${WEB_PORT:-5173}:5173"

volumes:
  db-data:
  web-node-modules:
