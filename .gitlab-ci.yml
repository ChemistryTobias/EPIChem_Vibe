# EPIChem CI/CD — gitlab.gwdg.de
#
# Read docs/HOST_SETUP.md before the first run: this pipeline needs the
# container registry enabled and a runner that can build images.
#
#     lint -> test(frontend only) -> build -> verify -> deploy
#
# `verify` is the stage that earns the rest. Anyone can build an image that
# pushes successfully; this brings the ACTUAL PRODUCTION IMAGES up together
# with a real Postgres and waits for health. A green build with a broken
# stack is the failure mode this exists to catch.
#
# No `test` stage for the backend, and no `docs` stage: backend/tests/ (the
# old backend's 101 tests) was deleted alongside backend/epichem/ — see
# backend/tests/TESTED.md for what it used to cover, backend/app/ has zero
# tests today. Docs are plain markdown, viewable in GitLab directly — no
# build/publish step.

stages:
  - lint
  - test
  - build
  - verify
  - deploy

variables:
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  npm_config_cache: $CI_PROJECT_DIR/.cache/npm
  # NOTE: POSTGRES_PASSWORD is intentionally NOT set here. It's only needed
  # by the prod-compose `verify:stack` job; set globally it would leak into
  # every other job that touches compose.prod.yaml.

# If you register the dedicated project runner with a tag, uncomment this so
# jobs only ever land on it. Leave it commented to use whatever runner the
# project has available, including GWDG's shared runners.
# default:
#   tags:
#     - epichem

workflow:
  rules:
    # Don't run the branch pipeline and the MR pipeline for the same commit.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------- templates
.python:
  image: python:3.13-slim
  before_script:
    - pip install --quiet -e "./backend[dev]"
  cache:
    key:
      files:
        - backend/pyproject.toml
    paths:
      - .cache/pip

.node:
  image: node:20-alpine
  before_script:
    - cd frontend && npm ci --prefer-offline
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .cache/npm

# -------------------------------------------------------------------- lint
lint:backend:
  extends: .python
  stage: lint
  script:
    - cd backend && ruff check app

lint:frontend:
  extends: .node
  stage: lint
  script:
    - npm run typecheck

# -------------------------------------------------------------------- test
test:backend:
  extends: .python
  stage: test
  script:
    - cd backend && pytest --junitxml=../junit-backend.xml
  artifacts:
    when: always
    reports:
      junit: junit-backend.xml

test:pod:
  extends: .python
  stage: test
  script:
    - pip install --quiet ./bluesky pytest
    - cd bluesky && pytest --junitxml=../junit-pod.xml
  artifacts:
    when: always
    reports:
      junit: junit-pod.xml

test:frontend:
  extends: .node
  stage: test
  script:
    - npx vitest run --reporter=junit --outputFile=../junit-frontend.xml
  artifacts:
    when: always
    reports:
      junit: junit-frontend.xml

# ------------------------------------------------------------------- build
.docker:
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    # Non-TLS dind. The TLS variant (port 2376, DOCKER_TLS_CERTDIR=/certs)
    # requires the runner to share /certs/client as a volume between the dind
    # service and the job container. GWDG's shared runner does not, so the job
    # failed at `docker login` with:
    #   unable to resolve docker endpoint: open /certs/client/ca.pem: no such
    #   file or directory
    # Talking to dind over plaintext on 2375 needs no shared volume and works
    # on shared runners we don't control. The traffic stays on the runner's
    # internal service network and never leaves the host. If GWDG later gives
    # us a runner configured with `volumes = ["/certs/client"]`, switch back to
    # 2376 + DOCKER_TLS_CERTDIR=/certs + DOCKER_TLS_VERIFY=1.
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    # Whether `docker compose` ships in the cli image has changed between
    # releases; install it if absent rather than depending on which side of
    # that change the pinned tag falls on.
    - docker compose version >/dev/null 2>&1 || apk add --no-cache docker-cli-compose
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

build:backend:
  extends: .docker
  stage: build
  script:
    # Two tags on one build: the SHA is what `verify` and `deploy` reference
    # (exact and immutable), `latest` is the convenience pointer for humans.
    - docker build --target runtime
        --cache-from "$BACKEND_IMAGE:latest"
        --build-arg BUILDKIT_INLINE_CACHE=1
        -t "$BACKEND_IMAGE:$CI_COMMIT_SHA"
        -t "$BACKEND_IMAGE:latest"
        ./backend
    - docker push "$BACKEND_IMAGE:$CI_COMMIT_SHA"
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then docker push "$BACKEND_IMAGE:latest"; fi
    - if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$BACKEND_IMAGE:$CI_COMMIT_SHA" "$BACKEND_IMAGE:$CI_COMMIT_TAG";
        docker push "$BACKEND_IMAGE:$CI_COMMIT_TAG";
      fi

build:frontend:
  extends: .docker
  stage: build
  script:
    - docker build --target runtime
        --cache-from "$FRONTEND_IMAGE:latest"
        --build-arg BUILDKIT_INLINE_CACHE=1
        -t "$FRONTEND_IMAGE:$CI_COMMIT_SHA"
        -t "$FRONTEND_IMAGE:latest"
        ./frontend
    - docker push "$FRONTEND_IMAGE:$CI_COMMIT_SHA"
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then docker push "$FRONTEND_IMAGE:latest"; fi
    - if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$FRONTEND_IMAGE:$CI_COMMIT_SHA" "$FRONTEND_IMAGE:$CI_COMMIT_TAG";
        docker push "$FRONTEND_IMAGE:$CI_COMMIT_TAG";
      fi

# ------------------------------------------------------------------ verify
# Brings the production stack up from the images just built and asserts it
# reaches a healthy state — a real Postgres, migrations-free schema creation,
# api actually answering. No browser step: that used to screenshot the
# console (docs/MILESTONE_CI_CD.md §5) via deploy/screenshots.mjs, but
# frontend/ still targets the old backend's API shape (Roadmap milestone
# 0.3 repoints it at backend/app/), so a screenshot assertion would only ever
# fail on a broken console, not a broken stack. Rebuild that step once 0.3
# lands and there's something real to assert against.
verify:stack:
  extends: .docker
  stage: verify
  variables:
    # compose.prod.yaml requires this (its `${VAR:?}` guard refuses to start
    # otherwise). Throwaway value: the stack is destroyed in after_script.
    POSTGRES_PASSWORD: ci-throwaway-password
  script:
    - export EPICHEM_REGISTRY="$CI_REGISTRY_IMAGE" EPICHEM_VERSION="$CI_COMMIT_SHA"
    - docker compose -f compose.prod.yaml pull --quiet
    - docker compose -f compose.prod.yaml up -d
    # Wait on the API's own readiness endpoint rather than on a fixed sleep.
    - |
      echo "waiting for the stack to become healthy"
      for i in $(seq 1 60); do
        if docker compose -f compose.prod.yaml exec -T api \
             curl -fsS http://localhost:8000/api/v1/health >/dev/null 2>&1; then
          echo "healthy after ${i}s"; break
        fi
        if [ "$i" = "60" ]; then
          echo "STACK NEVER BECAME HEALTHY"
          docker compose -f compose.prod.yaml logs
          exit 1
        fi
        sleep 1
      done
  after_script:
    # Always collect logs — a failed verify job is useless without them.
    - docker compose -f compose.prod.yaml logs --no-color > compose-logs.txt 2>&1 || true
    - docker compose -f compose.prod.yaml down -v || true
  artifacts:
    when: always
    paths:
      - compose-logs.txt
    expire_in: 30 days

# ------------------------------------------------------------------ deploy
# Deploys by pulling the images onto the dedicated production runner and
# restarting the compose stack there. This matches how the institute intends
# to run EPIChem today: one host, one `docker compose`, images from this
# registry.
#
# Kubernetes/Helm (docs/MILESTONE_CI_CD.md §4) is NOT wired up, because open
# question 1 in that document — GitLab Kubernetes agent, or a runner with a
# kubeconfig? — has not been answered by FHI IT yet. Building a deploy job
# against a guess would be worse than not having one.
deploy:prod:
  stage: deploy
  # MUST run on the production host's own runner, not a shared one. See
  # docs/HOST_SETUP.md §4 for registering it with this tag.
  tags:
    - epichem-prod
  # No `image:` on purpose. This job must run with the SHELL executor, directly
  # on the production host, because it operates on a checkout and a compose
  # stack that live on that host's filesystem. Run it in a container and
  # $EPICHEM_PROD_DIR would resolve inside the container, where the deployment
  # does not exist, and `up -d` would start a second stack that vanishes with
  # the job. See docs/HOST_SETUP.md §4.
  variables:
    # The compose stack on the production host owns its own .env with the
    # real password; do not inherit this pipeline's throwaway value.
    POSTGRES_PASSWORD: ""
  environment:
    name: production
    url: $EPICHEM_PROD_URL
  rules:
    # Tags only, manual only. A production deploy should be a decision.
    - if: $CI_COMMIT_TAG
      when: manual
  script:
    - cd "$EPICHEM_PROD_DIR"
    - export EPICHEM_REGISTRY="$CI_REGISTRY_IMAGE" EPICHEM_VERSION="$CI_COMMIT_TAG"
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker compose -f compose.prod.yaml pull
    # `up -d` re-runs the one-shot migrate service first; Alembic is a no-op
    # when the schema is already at head, so this is safe on every deploy.
    - docker compose -f compose.prod.yaml up -d
    - docker compose -f compose.prod.yaml ps
