# Alembic config for EPIChem. Lives inside the package (next to alembic/) so
# `epichem init-db` finds it regardless of the working directory — see
# epichem/migrations.py, which is what builds the Config object at runtime.
#
# `sqlalchemy.url` is deliberately absent: env.py takes the URL from
# epichem.db (DATABASE_URL, sqlite fallback), so there is exactly one place
# that decides which database this talks to.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
