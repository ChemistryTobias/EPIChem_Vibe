[project]
name = "epichem-backend"
version = "0.1.0"
description = "EPIChem control-plane API (backend/app — the active backend)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "python-multipart>=0.0.9",
  # Talks to each station's bluesky-httpserver (workflow dispatch).
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = [
    "I001",   # unsorted/unformatted import block
    "UP045",  # "use `X | None`" instead of `Optional[X]`
    "BLE001", # blind `except Exception`
    "B008",   # function call (e.g. Depends()) in argument defaults
]
