document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\", topic: \"pipette_1\", dur: 3,\n    params: [[\"rack_no\", \"1\"], [\"tip_pos\", \"1\"]] },\n  { fn: \"aspirate_liquid\", kind: \"liquid\", station: \"Pipette P1\", topic: \"pipette_1\", dur: 5,\n    params: [[\"vial_no\", \"10\"], [\"volume_uL\", \"50.0\"]] },\n  { fn: \"dispense_liquid\", kind: \"liquid\", station: \"Pipette P1\", topic: \"pipette_1\", dur: 4,\n    params: [[\"volume_uL\", \"50.0\"]] },\n  { fn: \"discard_pipette_tip\", kind: \"liquid\", station: \"Pipette P1\", topic: \"pipette_1\", dur: 3, params: [] },\n  { fn: \"set_spinning_params\", kind: \"spin\", station: \"Spincoater S1\", topic: \"spincoater_1\", dur: 2,\n    params: [[\"speed\", \"1000\"], [\"acceleration\", \"300\"]] },\n  { fn: \"start_spinning\", kind: \"spin\", station: \"Spincoater S1\", topic: \"spincoater_1\", dur: 10, params: [] },\n  { fn: \"wait\", kind: \"control\", station: \"Scheduler\", topic: \"scheduler\", dur: 10, params: [[\"statement\", \"10.0\"]] },\n  { fn: \"start_spinning\", kind: \"spin\", station: \"Spincoater S1\", topic: \"spincoater_1\", dur: 10, params: [] },\n  { fn: \"pickup_and_deliver\", kind: \"transport\", station: \"SCARA A1\", topic: \"scara_a1\", dur: 12,\n    params: [[\"start_station\", \"spincoater\"], [\"start_pos\", \"position\"], [\"end_station\", \"hotplate\"], [\"end_pos\", \"1\"]] },\n  { fn: \"pickup_and_deliver\", kind: \"transport\", station: \"SCARA A1\", topic: \"scara_a1\", dur: 11,\n    params: [[\"start_station\", \"hotplate\"], [\"start_pos\", \"1\"], [\"end_station\", \"processing_rack\"], [\"end_pos\", \"1\"]] },\n  { fn: \"pickup_and_deliver\", kind: \"transport\", station: \"SCARA A1\", topic: \"scara_a1\", dur: 13,\n    params: [[\"start_station\", \"processing_rack\"], [\"start_pos\", \"carrier_pickup\"], [\"end_station\", \"finished_rack\"], [\"end_pos\", \"carrier_pickup\"]] },\n  { fn: \"wait\", kind: \"control\", station: \"Scheduler\", topic: \"scheduler\", dur: 10, params: [[\"statement\", \"10.0\"]] },\n  { fn: \"stop_heating\", kind: \"thermal\", station: \"Hotplate H1\", topic: \"hotplate_1\", dur: 3, params: [[\"hotplate_no\", \"1\"]] }\n];\n\nconst NW = 208, NH = 108, GX = 48, GY = 44, COLS = 4;\n\nconst STATIONS = [\n  { id: \"rack_start\",  label: \"START RACK\",    kind: \"storage\",  col: 0, row: 0, H: 30, deviceId: null },\n  { id: \"rack_proc\",   label: \"PROCESS RACK\",  kind: \"storage\",  col: 1, row: 0, H: 30, deviceId: null },\n  { id: \"rack_finish\", label: \"FINISH RACK\",   kind: \"storage\",  col: 2, row: 0, H: 30, deviceId: null },\n  { id: \"rack_tip\",    label: \"TIP RACK\",      kind: \"storage\",  col: 5, row: 0, H: 24, deviceId: null },\n  { id: \"scara_a1\",    label: \"SCARA A1\",      kind: \"transport\", col: 1, row: 2, H: 150, deviceId: \"scara_a1\" },\n  { id: \"pipette_1\",   label: \"PIPETTE P1\",    kind: \"liquid\",   col: 4, row: 1, H: 92,  deviceId: \"pipette_1\" },\n  { id: \"hotplate_1\",  label: \"HOTPLATE H1\",   kind: \"thermal\",  col: 3, row: 3, H: 46,  deviceId: \"hotplate_1\" },\n  { id: \"hotplate_2\",  label: \"HOTPLATE H2\",   kind: \"thermal\",  col: 4, row: 3, H: 46,  deviceId: \"hotplate_2\" },\n  { id: \"spincoater_1\", label: \"SPINCOATER S1\", kind: \"spin\",    col: 2, row: 2, H: 68,  deviceId: \"spincoater_1\" }\n];\nconst LAB_COLS = 6, LAB_ROWS = 4, W2 = 50, H2 = 29, TW = 100, TH = 58;\nconst LAB_ORIGIN_X = 220, LAB_ORIGIN_Y = 210, LAB_W = 640, LAB_H = 540;\nconst DEFAULT_H = { thermal: 46, liquid: 92, transport: 150, spin: 68, storage: 30 };\n\nconst DEFAULT_SAMPLES = [\n  { id: \"SMP-08\", vialNo: 10, composition: \"PbI2:MAI 1:1 in DMF\", volume: \"500 µL\", conc: \"0.8 M\", rack: \"start_rack\", pos: \"A3\", status: \"Processing\", updated: \"00:04\" },\n  { id: \"SMP-07\", vialNo: 9,  composition: \"MAPbI3 precursor, 1.2 M DMSO\", volume: \"480 µL\", conc: \"1.2 M\", rack: \"start_rack\", pos: \"A2\", status: \"Queued\", updated: \"12:40\" },\n  { id: \"SMP-06\", vialNo: 8,  composition: \"FAPbI3 precursor, 1.0 M DMF:DMSO 4:1\", volume: \"500 µL\", conc: \"1.0 M\", rack: \"start_rack\", pos: \"A1\", status: \"Queued\", updated: \"12:40\" },\n  { id: \"SMP-05\", vialNo: 6,  composition: \"PbI2:MAI 1:1 in DMF\", volume: \"420 µL\", conc: \"0.8 M\", rack: \"processing_rack\", pos: \"1\", status: \"Complete\", updated: \"07:52\" },\n  { id: \"SMP-04\", vialNo: 5,  composition: \"PbI2:MAI 1:1 in DMF, anneal 90 °C\", volume: \"500 µL\", conc: \"0.8 M\", rack: \"finished_rack\", pos: \"1\", status: \"Complete\", updated: \"06:18\" },\n  { id: \"SMP-03\", vialNo: 3,  composition: \"Cs0.05FA0.95PbI3, 1.1 M\", volume: \"500 µL\", conc: \"1.1 M\", rack: \"finished_rack\", pos: \"2\", status: \"Complete\", updated: \"04:31\" },\n  { id: \"SMP-02\", vialNo: 2,  composition: \"control blank — DMF only\", volume: \"500 µL\", conc: \"—\", rack: \"finished_rack\", pos: \"3\", status: \"Archived\", updated: \"yesterday\" },\n  { id: \"SMP-01\", vialNo: 1,  composition: \"control blank — DMSO only\", volume: \"500 µL\", conc: \"—\", rack: \"finished_rack\", pos: \"4\", status: \"Archived\", updated: \"yesterday\" }\n];\n\nfunction pad(n, w) { let s = String(n); while (s.length < w) s = \"0\" + s; return s; }\nfunction shade(hex, f) {\n  const n = parseInt(hex.slice(1), 16);\n  const r = Math.round(((n >> 16) & 255) * f), g = Math.round(((n >> 8) & 255) * f), b = Math.round((n & 255) * f);\n  return \"rgb(\" + r + \",\" + g + \",\" + b + \")\";\n}\nfunction isoCenter(col, row) { return { x: LAB_ORIGIN_X + (col - row) * W2, y: LAB_ORIGIN_Y + (col + row) * H2 }; }\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.proc = PROC.slice();\n    this.stations = STATIONS.map((s) => Object.assign({}, s));\n    this.wfRef = React.createRef();\n    this.labRef = React.createRef();\n    this.state = {\n      screen: \"workflow\",\n      selected: \"n09\",\n      selectedStation: \"scara_a1\",\n      newStationKind: \"thermal\",\n      stationCount: this.stations.length,\n      samples: DEFAULT_SAMPLES.slice(),\n      sampleFilter: \"All\",\n      selectedSample: \"SMP-08\",\n      running: true,\n      stepIndex: 4,\n      stepElapsed: 2.4,\n      total: 38.2,\n      temps: Array.from({ length: 60 }, (_, i) => 22 + 8 * Math.min(1, i / 34) + Math.sin(i / 3) * 0.25),\n      logs: [],\n      devices: [\n        { id: \"scara_a1\", name: \"SCARA Arm A1\", type: \"transport\", status: \"Busy\", since: \"00:04\", metrics: [[\"joint_load\", \"42 %\"], [\"reach\", \"610 mm\"], [\"cycle\", \"11.4 s\"], [\"homed\", \"true\"]] },\n        { id: \"gripper_g1\", name: \"Parallel Gripper G1\", type: \"gripper\", status: \"Busy\", since: \"00:04\", metrics: [[\"grip_force\", \"12.0 N\"], [\"opening\", \"18.2 mm\"], [\"payload\", \"34 g\"], [\"object\", \"vial_10\"]] },\n        { id: \"pipette_1\", name: \"Liquid Handler P1\", type: \"pipette\", status: \"Idle\", since: \"01:12\", metrics: [[\"tip\", \"mounted\"], [\"volume\", \"50.0 µL\"], [\"plunger\", \"72 %\"], [\"tips_left\", \"94\"]] },\n        { id: \"hotplate_1\", name: \"Hotplate H1\", type: \"thermal\", status: \"Busy\", since: \"00:34\", metrics: [[\"T_set\", \"30.0 °C\"], [\"T_act\", \"29.6 °C\"], [\"ramp\", \"1.8 K/min\"], [\"power\", \"31 %\"]] },\n        { id: \"hotplate_2\", name: \"Hotplate H2\", type: \"thermal\", status: \"Idle\", since: \"14:02\", metrics: [[\"T_set\", \"—\"], [\"T_act\", \"22.4 °C\"], [\"ramp\", \"0.0 K/min\"], [\"power\", \"0 %\"]] },\n        { id: \"spincoater_1\", name: \"BLDC Spincoater S1\", type: \"spincoater\", status: \"Idle\", since: \"00:58\", metrics: [[\"speed\", \"0 rpm\"], [\"accel\", \"300 rpm/s\"], [\"chuck\", \"vacuum ok\"], [\"runs\", \"218\"]] }\n      ],\n      now: new Date(Date.UTC(2026, 7, 4, 9, 14, 6))\n    };\n  }\n\n  componentDidMount() {\n    this._jointTries = 0;\n    this._jointPoll = setInterval(() => {\n      if (window.joint) {\n        clearInterval(this._jointPoll);\n        this.ensureWorkflowGraph();\n        if (this.state.screen === \"lab\") this.ensureLabGraph();\n      } else if (++this._jointTries > 100) {\n        clearInterval(this._jointPoll);\n      }\n    }, 100);\n    this._iv = setInterval(() => this.tick(), 250);\n    this.seedLogs();\n  }\n\n  componentWillUnmount() {\n    clearInterval(this._jointPoll);\n    clearInterval(this._iv);\n    if (this.wfPaper) this.wfPaper.remove();\n    if (this.labPaper) this.labPaper.remove();\n  }\n\n  registerShapes() {\n    const joint = window.joint;\n    if (joint.shapes.epi) return;\n    joint.shapes.epi = {};\n    joint.shapes.epi.Node = joint.dia.Element.define(\"epi.Node\", {\n      size: { width: NW, height: NH },\n      attrs: {\n        body: { refWidth: \"100%\", refHeight: \"100%\", fill: \"#FFFFFF\", stroke: \"#A7A7A8\", strokeWidth: 1, rx: 2, ry: 2 },\n        header: { refWidth: \"100%\", height: 24, fill: \"#006C66\" },\n        numText: { refX: 10, refY: 12, fontFamily: \"ui-monospace, monospace\", fontSize: 10, fontWeight: 700, fill: \"#FFFFFF\", textAnchor: \"start\", yAlignment: \"middle\" },\n        fnText: { refX: 32, refY: 12, fontFamily: \"Roboto, Arial, sans-serif\", fontSize: 11, fontWeight: 700, fill: \"#FFFFFF\", textAnchor: \"start\", yAlignment: \"middle\" },\n        dot: { refX: NW - 16, refY: 12, r: 3.5, fill: \"#EEEEEE\" },\n        summaryText: { refX: 10, refY: 40, fontFamily: \"ui-monospace, monospace\", fontSize: 9.5, fill: \"#777777\", textAnchor: \"start\" },\n        stationText: { refX: 10, refY: NH - 10, fontFamily: \"Roboto, Arial, sans-serif\", fontSize: 9, fontWeight: 700, fill: \"#A7A7A8\", textAnchor: \"start\" }\n      }\n    }, {\n      markup: [\n        { tagName: \"rect\", selector: \"body\" },\n        { tagName: \"rect\", selector: \"header\" },\n        { tagName: \"text\", selector: \"numText\" },\n        { tagName: \"text\", selector: \"fnText\" },\n        { tagName: \"circle\", selector: \"dot\" },\n        { tagName: \"text\", selector: \"summaryText\" },\n        { tagName: \"text\", selector: \"stationText\" }\n      ]\n    });\n    joint.shapes.epi.Tile = joint.dia.Element.define(\"epi.Tile\", {\n      attrs: { body: { fill: \"#FFFFFF\", stroke: \"#A7A7A8\", strokeWidth: 1 } }\n    }, { markup: [{ tagName: \"polygon\", selector: \"body\" }] });\n    joint.shapes.epi.Block = joint.dia.Element.define(\"epi.Block\", {\n      attrs: {\n        left: { stroke: \"#FFFFFF\", strokeWidth: 1 },\n        right: { stroke: \"#FFFFFF\", strokeWidth: 1 },\n        top: { stroke: \"#FFFFFF\", strokeWidth: 1 },\n        label: { fontFamily: \"Roboto, Arial, sans-serif\", fontSize: 10, fontWeight: 700, fill: \"#FFFFFF\", textAnchor: \"middle\" },\n        dot: { r: 4, fill: \"#EEEEEE\", stroke: \"#FFFFFF\", strokeWidth: 1 }\n      }\n    }, {\n      markup: [\n        { tagName: \"polygon\", selector: \"left\" },\n        { tagName: \"polygon\", selector: \"right\" },\n        { tagName: \"polygon\", selector: \"top\" },\n        { tagName: \"text\", selector: \"label\" },\n        { tagName: \"circle\", selector: \"dot\" }\n      ]\n    });\n  }\n\n  ensureWorkflowGraph() {\n    if (!window.joint || !this.wfRef.current) return;\n    if (this.wfPaper && this._wfEl === this.wfRef.current) { this.syncWorkflowRun(); return; }\n    this.registerShapes();\n    const joint = window.joint;\n    if (this.wfPaper) this.wfPaper.remove();\n    this._wfEl = this.wfRef.current;\n    const graph = new joint.dia.Graph({}, { cellNamespace: joint.shapes });\n    const paper = new joint.dia.Paper({\n      el: this.wfRef.current, model: graph, width: this.canvasW(), height: this.canvasH(),\n      cellViewNamespace: joint.shapes, interactive: true,\n      background: { color: \"#EEEEEE\" },\n      drawGrid: (this.props.canvasGrid ?? true) ? { name: \"dot\", args: { color: \"#A7A7A8\", thickness: 1 } } : false,\n      defaultConnector: { name: \"smooth\" },\n      defaultLink: () => new joint.shapes.standard.Link()\n    });\n    this.wfGraph = graph; this.wfPaper = paper;\n    this.proc.forEach((p, i) => this.addWorkflowNode(i, p));\n    for (let i = 0; i < this.proc.length - 1; i++) this.addWorkflowLink(i, i + 1);\n    paper.on(\"element:pointerclick\", (view) => this.setState({ selected: view.model.id }));\n    this.syncWorkflowRun();\n  }\n\n  canvasW() { const c = COLS; return 64 + c * NW + (c - 1) * GX; }\n  canvasH() { const rows = Math.ceil(this.proc.length / COLS); return 64 + rows * NH + (rows - 1) * GY; }\n\n  addWorkflowNode(i, p) {\n    const joint = window.joint;\n    const row = Math.floor(i / COLS), ci = i % COLS;\n    const col = row % 2 === 0 ? ci : COLS - 1 - ci;\n    const x = 32 + col * (NW + GX), y = 32 + row * (NH + GY);\n    const k = KINDS[p.kind];\n    const node = new joint.shapes.epi.Node({ id: \"n\" + pad(i + 1, 2), position: { x, y } });\n    node.attr(\"header/fill\", k.color);\n    node.attr(\"numText/text\", pad(i + 1, 2));\n    node.attr(\"fnText/text\", p.fn);\n    node.attr(\"stationText/text\", p.station.toUpperCase());\n    node.attr(\"summaryText/text\", p.params.length ? p.params.slice(0, 3).map((pp) => pp[0] + \"=\" + pp[1]).join(\"\\n\") : \"no arguments\");\n    node.addTo(this.wfGraph);\n  }\n\n  addWorkflowLink(i, j) {\n    const joint = window.joint;\n    const link = new joint.shapes.standard.Link({\n      source: { id: \"n\" + pad(i + 1, 2) }, target: { id: \"n\" + pad(j + 1, 2) }\n    });\n    link.set(\"epiIndex\", i);\n    link.attr(\"line/stroke\", \"#777777\");\n    link.attr(\"line/strokeWidth\", 1.2);\n    link.attr(\"line/targetMarker\", { type: \"path\", d: \"M 8 -4 0 0 8 4 Z\", fill: \"#777777\" });\n    link.addTo(this.wfGraph);\n  }\n\n  syncWorkflowRun() {\n    if (!this.wfGraph) return;\n    const st = this.state;\n    this.wfGraph.getElements().forEach((el) => {\n      const idx = parseInt(el.id.slice(1), 10) - 1;\n      const done = idx < st.stepIndex, active = st.running && idx === st.stepIndex;\n      el.attr(\"dot/fill\", active ? \"#00B1EA\" : (done ? \"#006C66\" : \"#EEEEEE\"));\n      el.attr(\"body/stroke\", el.id === st.selected ? \"#006C66\" : \"#A7A7A8\");\n      el.attr(\"body/strokeWidth\", el.id === st.selected ? 2 : 1);\n    });\n    this.wfGraph.getLinks().forEach((l) => {\n      const i = l.get(\"epiIndex\");\n      const live = st.running && i + 1 === st.stepIndex;\n      l.attr(\"line/stroke\", live ? \"#006C66\" : \"#777777\");\n      l.attr(\"line/strokeWidth\", live ? 2 : 1.2);\n      l.attr(\"line/targetMarker/fill\", live ? \"#006C66\" : \"#777777\");\n    });\n  }\n\n  isoBoxPaths(H) {\n    return {\n      top: [[W2, 0], [TW, H2], [W2, TH], [0, H2]].map((p) => p.join(\",\")).join(\" \"),\n      left: [[0, H2], [W2, TH], [W2, H + TH], [0, H + H2]].map((p) => p.join(\",\")).join(\" \"),\n      right: [[TW, H2], [W2, TH], [W2, H + TH], [TW, H + H2]].map((p) => p.join(\",\")).join(\" \"),\n      width: TW, height: H + TH\n    };\n  }\n\n  ensureLabGraph() {\n    if (!window.joint || !this.labRef.current) return;\n    if (this.labPaper && this._labEl === this.labRef.current) return;\n    this.registerShapes();\n    const joint = window.joint;\n    if (this.labPaper) this.labPaper.remove();\n    this._labEl = this.labRef.current;\n    const graph = new joint.dia.Graph({}, { cellNamespace: joint.shapes });\n    const paper = new joint.dia.Paper({\n      el: this.labRef.current, model: graph, width: LAB_W, height: LAB_H,\n      cellViewNamespace: joint.shapes, interactive: false, background: { color: \"#EEEEEE\" }\n    });\n    this.labGraph = graph; this.labPaper = paper;\n    for (let r = 0; r < LAB_ROWS; r++) {\n      for (let c = 0; c < LAB_COLS; c++) {\n        const ctr = isoCenter(c, r);\n        const tile = new joint.shapes.epi.Tile({\n          position: { x: ctr.x - W2, y: ctr.y - H2 }, size: { width: TW, height: TH }\n        });\n        tile.attr(\"body/points\", [[W2, 0], [TW, H2], [W2, TH], [0, H2]].map((p) => p.join(\",\")).join(\" \"));\n        tile.addTo(graph);\n      }\n    }\n    this.stations.forEach((s) => this.addLabBlock(s));\n    paper.on(\"element:pointerclick\", (view) => {\n      const id = view.model.get(\"epiId\");\n      if (id) this.setState({ selectedStation: id });\n    });\n    this.syncLabDevices();\n  }\n\n  addLabBlock(s) {\n    const joint = window.joint;\n    const geom = this.isoBoxPaths(s.H);\n    const ctr = isoCenter(s.col, s.row);\n    const k = KINDS[s.kind];\n    const block = new joint.shapes.epi.Block({\n      position: { x: ctr.x - W2, y: ctr.y - (s.H + H2) }, size: { width: geom.width, height: geom.height }\n    });\n    block.set(\"epiId\", s.id);\n    block.attr(\"top/points\", geom.top);\n    block.attr(\"left/points\", geom.left);\n    block.attr(\"right/points\", geom.right);\n    block.attr(\"top/fill\", k.color);\n    block.attr(\"left/fill\", shade(k.color, 0.55));\n    block.attr(\"right/fill\", shade(k.color, 0.75));\n    block.attr(\"label/text\", s.label);\n    block.attr(\"label/x\", W2); block.attr(\"label/y\", H2);\n    block.attr(\"dot/cx\", W2); block.attr(\"dot/cy\", H2 - 12);\n    block.addTo(this.labGraph);\n  }\n\n  syncLabDevices() {\n    if (!this.labGraph) return;\n    this.stations.forEach((s) => {\n      if (!s.deviceId) return;\n      const dev = this.state.devices.filter((d) => d.id === s.deviceId)[0];\n      const cell = this.labGraph.getCell(s.id);\n      if (dev && cell) cell.attr(\"dot/fill\", STATUS_COLORS[dev.status]);\n    });\n  }\n\n  stamp(offset) {\n    const d = new Date(this.state.now.getTime() + (offset || 0));\n    return pad(d.getUTCHours(), 2) + \":\" + pad(d.getUTCMinutes(), 2) + \":\" + pad(d.getUTCSeconds(), 2) + \".\" + pad(d.getUTCMilliseconds(), 3).slice(0, 3);\n  }\n\n  seedLogs() {\n    const seeds = [\n      [\"pipette_1\", \"aspirate_liquid vial_no=10 volume_uL=50.0 → accepted\"],\n      [\"hotplate_1\", \"T_act=29.61 °C setpoint=30.00 °C power=31 %\"],\n      [\"scara_a1\", \"trajectory processing_rack:1 → spincoater:position complete\"],\n      [\"scheduler\", \"capability contract validated for 16/16 operations\"],\n      [\"gripper_g1\", \"grip_force=12.0 N object=vial_10 latched\"],\n      [\"vre\", \"dataset epichem/run-2026-0804-014 metadata committed\"],\n      [\"hotplate_1\", \"start_heating hotplate_no=1 T_set_celsius=30 wait=False\"],\n      [\"scara_a1\", \"trajectory start_rack → processing_rack complete\"]\n    ];\n    this.setState({ logs: seeds.map((s, i) => ({ t: this.stamp(-i * 3400), station: s[0], msg: s[1] })) });\n  }\n\n  tick() {\n    const speed = this.props.runSpeed ?? 4;\n    this.setState((s) => {\n      const next = { now: new Date(s.now.getTime() + 250 * speed) };\n      const t = s.temps.slice(1);\n      const target = s.running ? 30 : 22.4;\n      const last = s.temps[s.temps.length - 1];\n      t.push(last + (target - last) * 0.06 + (Math.random() - 0.5) * 0.14);\n      next.temps = t;\n      next.devices = s.devices.map((d) => {\n        if (d.status !== \"Busy\") return d;\n        const m = d.metrics.map((p) => p.slice());\n        if (d.id === \"hotplate_1\") m[1][1] = t[t.length - 1].toFixed(2) + \" °C\";\n        if (d.id === \"scara_a1\") m[0][1] = (38 + Math.random() * 9).toFixed(0) + \" %\";\n        if (d.id === \"spincoater_1\") m[0][1] = (960 + Math.random() * 80).toFixed(0) + \" rpm\";\n        if (d.id === \"gripper_g1\") m[0][1] = (11.4 + Math.random() * 1.2).toFixed(1) + \" N\";\n        return Object.assign({}, d, { metrics: m });\n      });\n      if (!s.running) return next;\n      const dt = 0.25 * speed;\n      let idx = s.stepIndex, el = s.stepElapsed + dt;\n      const logs = s.logs;\n      if (el >= PROC[idx].dur) {\n        el = 0;\n        const done = PROC[idx];\n        const entry = { t: this.stamp(250 * speed), station: done.topic, msg: done.fn + \" completed · dt=\" + done.dur.toFixed(1) + \" s\" };\n        idx = idx + 1;\n        if (idx >= PROC.length) {\n          next.running = false;\n          idx = PROC.length - 1;\n          next.logs = [{ t: this.stamp(250 * speed), station: \"vre\", msg: \"run finished · 16/16 steps · FAIR record sealed\" }, entry].concat(logs).slice(0, 60);\n        } else {\n          const nx = PROC[idx];\n          next.logs = [{ t: this.stamp(250 * speed), station: nx.topic, msg: nx.fn + \" dispatched → \" + nx.station }, entry].concat(logs).slice(0, 60);\n        }\n      }\n      next.stepIndex = idx;\n      next.stepElapsed = el;\n      next.total = s.total + dt;\n      return next;\n    }, () => { this.syncWorkflowRun(); this.syncLabDevices(); });\n  }\n\n  fmt(sec) {\n    const m = Math.floor(sec / 60), s = Math.floor(sec % 60);\n    return pad(m, 2) + \":\" + pad(s, 2);\n  }\n\n  addNode() {\n    const i = this.proc.length;\n    const p = { fn: \"wait\", kind: \"control\", station: \"Scheduler\", topic: \"scheduler\", dur: 10, params: [[\"statement\", \"10.0\"]] };\n    this.proc.push(p);\n    if (this.wfGraph) {\n      this.addWorkflowNode(i, p);\n      this.addWorkflowLink(i - 1, i);\n      this.wfPaper.setDimensions(this.canvasW(), this.canvasH());\n    }\n    this.setState({ selected: \"n\" + pad(i + 1, 2) });\n  }\n\n  addStation() {\n    const occupied = {};\n    this.stations.forEach((s) => { occupied[s.col + \"_\" + s.row] = true; });\n    let target = null;\n    for (let r = 0; r < LAB_ROWS && !target; r++) for (let c = 0; c < LAB_COLS && !target; c++) if (!occupied[c + \"_\" + r]) target = { col: c, row: r };\n    if (!target) return;\n    const kind = this.state.newStationKind;\n    const s = { id: \"st_\" + Date.now(), label: kind.toUpperCase() + \" \" + (this.stations.length + 1), kind: kind, col: target.col, row: target.row, H: DEFAULT_H[kind], deviceId: null };\n    this.stations.push(s);\n    if (this.labGraph) this.addLabBlock(s);\n    this.setState({ stationCount: this.stations.length, selectedStation: s.id });\n  }\n\n  renderVals() {\n    const st = this.state;\n    const nav = [\n      { key: \"workflow\", label: \"WORKFLOW DESIGNER\", meta: String(this.proc.length) },\n      { key: \"devices\", label: \"DEVICE CONTROL\", meta: String(st.devices.length) },\n      { key: \"samples\", label: \"SAMPLES\", meta: String(st.samples.length) },\n      { key: \"lab\", label: \"LAB LAYOUT\", meta: String(st.stationCount) },\n      { key: \"monitor\", label: \"RUN MONITOR\", meta: st.running ? \"live\" : \"idle\" }\n    ];\n    const navItems = nav.map((n) => ({\n      label: n.label, meta: n.meta,\n      bar: st.screen === n.key ? \"#FFFFFF\" : \"transparent\",\n      bg: st.screen === n.key ? \"rgba(255,255,255,0.14)\" : \"transparent\",\n      fg: st.screen === n.key ? \"#FFFFFF\" : \"rgba(255,255,255,0.72)\",\n      onClick: () => {\n        this.setState({ screen: n.key });\n        setTimeout(() => { if (n.key === \"workflow\") this.ensureWorkflowGraph(); if (n.key === \"lab\") this.ensureLabGraph(); }, 0);\n      }\n    }));\n\n    const selIdx = st.selected ? parseInt(st.selected.slice(1), 10) - 1 : -1;\n    const selP = selIdx >= 0 && selIdx < this.proc.length ? this.proc[selIdx] : null;\n    let sel = null;\n    if (selP) {\n      const k = KINDS[selP.kind];\n      const dev = st.devices.filter((d) => d.name === selP.station)[0];\n      sel = {\n        id: st.selected, label: selP.fn, kindLabel: k.label, accent: k.color,\n        params: selP.params.length ? selP.params.map((p) => ({ k: p[0], v: p[1] })) : [{ k: \"arguments\", v: \"none\" }],\n        contract: \"Contract satisfied — \" + selP.station,\n        contractDetail: \"requires: \" + (selP.params.map((p) => p[0]).join(\", \") || \"—\") + \"\\nexposed by station capability manifest v2.3 · nominal \" + selP.dur.toFixed(1) + \" s\",\n        station: selP.station, stationState: dev ? dev.status.toUpperCase() : \"READY\",\n        stationColor: dev ? STATUS_COLORS[dev.status] : \"#006C66\"\n      };\n    }\n\n    const devices = st.devices.map((d) => ({\n      id: d.id, name: d.name, type: d.type, status: d.status.toUpperCase(), since: \"since \" + d.since,\n      color: STATUS_COLORS[d.status],\n      metrics: d.metrics.map((m) => ({ k: m[0], v: m[1] })),\n      buttons: [\"Busy\", \"Error\"].map((s) => ({\n        label: s === \"Busy\" ? \"Start\" : s,\n        bg: d.status === s ? \"#006C66\" : \"transparent\",\n        fg: d.status === s ? \"#FFFFFF\" : \"#006C66\",\n        border: \"#006C66\",\n        onClick: () => this.setState((p) => ({ devices: p.devices.map((x) => x.id === d.id ? Object.assign({}, x, { status: s, since: \"00:00\" }) : x) }))\n      }))\n    }));\n\n    const counts = { Idle: 0, Busy: 0, Error: 0, Maint: 0 };\n    st.devices.forEach((d) => { counts[d.status]++; });\n    const summary = [\n      { label: \"STATIONS ONLINE\", value: String(st.devices.length), unit: \"/ 6\", color: \"#000000\" },\n      { label: \"BUSY\", value: String(counts.Busy), unit: \"stations\", color: \"#00B1EA\" },\n      { label: \"FAULTED\", value: String(counts.Error), unit: \"stations\", color: counts.Error ? \"#C0392B\" : \"#000000\" },\n      { label: \"QUEUE DEPTH\", value: String(Math.max(0, PROC.length - st.stepIndex)), unit: \"ops\", color: \"#000000\" },\n      { label: \"EDGE LOAD\", value: \"18\", unit: \"% · rpi5\", color: \"#000000\" }\n    ];\n\n    const steps = PROC.map((p, i) => {\n      const state = i < st.stepIndex ? \"DONE\" : (st.running && i === st.stepIndex ? \"RUNNING\" : \"QUEUED\");\n      return {\n        num: pad(i + 1, 2), label: p.fn, station: p.station, state: state,\n        stateColor: state === \"DONE\" ? \"#006C66\" : (state === \"RUNNING\" ? \"#00B1EA\" : \"#A7A7A8\"),\n        bg: state === \"RUNNING\" ? \"#EEEEEE\" : \"#FFFFFF\",\n        bar: state === \"RUNNING\" ? \"#00B1EA\" : \"transparent\",\n        fg: state === \"QUEUED\" ? \"#777777\" : \"#000000\",\n        weight: state === \"RUNNING\" ? 700 : 400\n      };\n    });\n\n    const temps = st.temps;\n    const min = Math.min.apply(null, temps) - 0.6, max = Math.max.apply(null, temps) + 0.6;\n    const pts = temps.map((v, i) => [(i / (temps.length - 1)) * 360, 92 - ((v - min) / (max - min)) * 84]);\n    const line = pts.map((p, i) => (i ? \"L\" : \"M\") + p[0].toFixed(1) + \",\" + p[1].toFixed(1)).join(\" \");\n\n    const cur = PROC[st.stepIndex];\n    const spin = st.devices.filter((d) => d.id === \"spincoater_1\")[0];\n    const tiles = [\n      { k: \"hotplate_1.T_act\", v: temps[temps.length - 1].toFixed(1), u: \"°C\" },\n      { k: \"spincoater_1.speed\", v: spin.status === \"Busy\" ? spin.metrics[0][1].split(\" \")[0] : \"0\", u: \"rpm\" },\n      { k: \"pipette_1.volume\", v: \"50.0\", u: \"µL\" },\n      { k: \"ambient.rh\", v: (41 + Math.sin(st.total / 9) * 1.2).toFixed(1), u: \"%\" }\n    ];\n\n    const filterOrder = [\"All\", \"Queued\", \"Processing\", \"Complete\", \"Archived\"];\n    const sampleTabs = filterOrder.map((f) => ({\n      label: f, fg: st.sampleFilter === f ? \"#006C66\" : \"#777777\", bar: st.sampleFilter === f ? \"#006C66\" : \"transparent\",\n      onClick: () => this.setState({ sampleFilter: f })\n    }));\n    const filteredSamples = st.samples.filter((s) => st.sampleFilter === \"All\" || s.status === st.sampleFilter).map((s) => ({\n      id: s.id, composition: s.composition, volume: s.volume,\n      location: s.rack.replace(\"_\", \" \") + \" · \" + s.pos, status: s.status.toUpperCase(),\n      statusColor: SAMPLE_COLORS[s.status], updated: s.updated,\n      bg: st.selectedSample === s.id ? \"#EEEEEE\" : \"#FFFFFF\",\n      onClick: () => this.setState({ selectedSample: s.id })\n    }));\n    const selS = st.samples.filter((s) => s.id === st.selectedSample)[0];\n    let selSample = null;\n    if (selS) {\n      selSample = {\n        id: selS.id, composition: selS.composition,\n        props: [{ k: \"vial_no\", v: String(selS.vialNo) }, { k: \"volume\", v: selS.volume }, { k: \"concentration\", v: selS.conc }, { k: \"location\", v: selS.rack.replace(\"_\", \" \") + \" · \" + selS.pos }],\n        buttons: [\"Queued\", \"Processing\", \"Complete\", \"Archived\"].map((s) => ({\n          label: s, bg: selS.status === s ? \"#006C66\" : \"transparent\", fg: selS.status === s ? \"#FFFFFF\" : \"#006C66\", border: \"#006C66\",\n          onClick: () => this.setState((p) => ({ samples: p.samples.map((x) => x.id === selS.id ? Object.assign({}, x, { status: s, updated: \"00:00\" }) : x) }))\n        })),\n        provenance: \"vial_no=\" + selS.vialNo + \" referenced in run 2026-0804-014\\naspirate_liquid · dispense_liquid\\nFAIR record: epichem/samples/\" + selS.id.toLowerCase()\n      };\n    }\n    const racks = [\"start_rack\", \"processing_rack\", \"finished_rack\", \"tip_rack\"];\n    const rackStrips = racks.map((r) => {\n      const inRack = st.samples.filter((s) => s.rack === r);\n      const total = 8;\n      const slots = Array.from({ length: total }, (_, i) => {\n        const s = inRack[i];\n        return s ? { fill: SAMPLE_COLORS[s.status], border: SAMPLE_COLORS[s.status] } : { fill: \"#FFFFFF\", border: \"#A7A7A8\" };\n      });\n      return { label: r.replace(\"_\", \" \").toUpperCase(), count: inRack.length, total: total, slots: slots };\n    });\n\n    const selStationData = this.stations.filter((s) => s.id === st.selectedStation)[0];\n    let selStation = null;\n    if (selStationData) {\n      const k = KINDS[selStationData.kind];\n      const dev = selStationData.deviceId ? st.devices.filter((d) => d.id === selStationData.deviceId)[0] : null;\n      selStation = {\n        label: selStationData.label, kindLabel: k.label, color: k.color, hasDevice: !!dev, isStorage: !dev,\n        status: dev ? dev.status.toUpperCase() : \"\", statusColor: dev ? STATUS_COLORS[dev.status] : \"#000000\",\n        metrics: dev ? dev.metrics.map((m) => ({ k: m[0], v: m[1] })) : []\n      };\n    }\n    const stationKindOptions = [\n      { value: \"transport\", label: \"Transport\" }, { value: \"liquid\", label: \"Liquid handling\" },\n      { value: \"thermal\", label: \"Thermal\" }, { value: \"spin\", label: \"Spin\" }, { value: \"storage\", label: \"Storage\" }\n    ];\n\n    const isWorkflow = st.screen === \"workflow\", isDevices = st.screen === \"devices\", isSamples = st.screen === \"samples\", isLab = st.screen === \"lab\", isMonitor = st.screen === \"monitor\";\n    return {\n      navItems: navItems,\n      runtime: [\n        { label: \"EPICS backend\", value: \"v2.3.1\", color: \"#00B1EA\" },\n        { label: \"MQTT broker\", value: \"ok\", color: \"#00B1EA\" },\n        { label: \"edge node\", value: \"rpi5\", color: \"#C6D325\" },\n        { label: \"VRE sync\", value: \"live\", color: \"#C6D325\" }\n      ],\n      isWorkflow: isWorkflow, isDevices: isDevices, isSamples: isSamples, isLab: isLab, isMonitor: isMonitor,\n      showRunButton: isWorkflow || isMonitor,\n      title: isWorkflow ? \"Workflow Designer\" : isDevices ? \"Device Control\" : isSamples ? \"Sample Management\" : isLab ? \"Lab Layout Designer\" : \"Run Monitor\",\n      subtitle: isWorkflow ? \"Perovskite film deposition · spin-coating series — 16 operations, compiled against station capability contracts\"\n        : isDevices ? \"Spincoating robot cell · SCARA transport, liquid handling, dual hotplates, BLDC spincoater\"\n        : isSamples ? \"Vial inventory across start, process, finish and tip racks — provenance tracked for FAIR compliance\"\n        : isLab ? \"Isometric floor plan of the spincoating robot cell · click a station to inspect, place new equipment from an open tile\"\n        : \"Live closed-loop execution · instrument and environmental telemetry streamed to the Virtual Research Environment\",\n      runLabel: st.running ? \"Pause run\" : \"Run workflow\",\n      toggleRun: () => this.setState((s) => ({ running: !s.running }), () => this.syncWorkflowRun()),\n      addNode: () => this.addNode(),\n      addSample: () => this.setState((s) => {\n        const n = \"SMP-\" + pad(s.samples.length + 1, 2);\n        return { samples: [{ id: n, vialNo: s.samples.length + 1, composition: \"unassigned\", volume: \"—\", conc: \"—\", rack: \"start_rack\", pos: \"—\", status: \"Queued\", updated: \"00:00\" }].concat(s.samples), selectedSample: n };\n      }),\n      newStationKind: st.newStationKind,\n      setNewStationKind: (e) => this.setState({ newStationKind: e.target.value }),\n      addStation: () => this.addStation(),\n      stationKindOptions: stationKindOptions,\n      wfRef: this.wfRef, labRef: this.labRef, labW: LAB_W, labH: LAB_H,\n      canvasW: this.canvasW(), canvasH: this.canvasH(),\n      sel: sel, hasSel: !!sel, noSel: !sel,\n      devices: devices, summary: summary,\n      sampleTabs: sampleTabs, filteredSamples: filteredSamples, hasSampleSel: !!selSample, noSampleSel: !selSample, selSample: selSample, rackStrips: rackStrips,\n      selStation: selStation, hasStationSel: !!selStation, noStationSel: !selStation,\n      steps: steps, tiles: tiles, logs: st.logs, logCount: 12840 + st.logs.length,\n      sparkPath: line, sparkArea: line + \" L360,92 L0,92 Z\",\n      progress: Math.min(100, ((st.stepIndex + st.stepElapsed / cur.dur) / PROC.length) * 100).toFixed(1),\n      elapsed: this.fmt(st.total), stepLabel: pad(st.stepIndex + 1, 2) + \" / 16\",\n      runState: st.running ? \"RUNNING\" : \"PAUSED\", runColor: st.running ? \"#00B1EA\" : \"#EF7C00\", runId: \"2026-0804-014\",\n      footLeft: isWorkflow ? this.proc.length + \" nodes · compiled\"\n        : isDevices ? st.devices.length + \" stations monitored\"\n        : isSamples ? st.samples.length + \" samples tracked\"\n        : isLab ? st.stationCount + \" stations placed\"\n        : \"step \" + (st.stepIndex + 1) + \" · \" + cur.fn,\n      footMid: isWorkflow ? \"capability validation passed\" : isDevices ? \"REST /api/v1/stations\" : isSamples ? \"REST /api/v1/samples\" : isLab ? \"REST /api/v1/layout\" : \"FAIR metadata: complete\",\n      msgRate: (18 + Math.round(Math.abs(Math.sin(st.total / 4)) * 9)),\n      clock: this.stamp(0)\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
