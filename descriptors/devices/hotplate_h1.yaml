apiVersion: epichem.dev/v1
kind: Device
metadata:
  code: DEV-HP-001
  name: Hotplate H1
  labels: {vendor: IKA, model: RCT-digital-5, owner: solbat}
spec:
  class: epichem.classes.HeaterStirrer
  parent: null
  ophyd:
    import: mpifkf_devices.ika:RCTDigital
    args: {prefix: "MPIFKF:HP1:"}
  transport:
    protocol: epics-ca
    uri: "ca://MPIFKF:HP1:"
    ioc_host: ioc-bench-a.lab3.mpi-fkf.mpg.de
  network:
    primary_ip: 10.42.13.21/24
    mac: "00:1b:44:11:3a:b7"
    vlan: lab3-instruments
  location:
    lab: LAB-3
    zone: ZONE-FUMEHOOD-2
    station: SPINBOT
    pose: {x_mm: 1420, y_mm: 300, z_mm: 900, yaw_deg: 0}
    # The device's own footprint box within the station canvas (ADR 0012), in mm.
    footprint: {size_x_mm: 180, size_y_mm: 160, size_z_mm: 120}
  capabilities:
    - heat
    - stir
    - read_temperature
  envelope:
    temperature_c: {min: 20, max: 300, resolution: 0.1, settling_s: 90}
    stir_rpm: {min: 0, max: 1500}
  safety:
    flags: [hot_surface]
    interlocks: [fumehood_sash_closed]
    max_unattended_minutes: 240
  operational:
    mode: read_write
    calibration: {last: "2026-05-14", due: "2026-11-14", certificate: "kadi:record/8821"}
