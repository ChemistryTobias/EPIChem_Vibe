apiVersion: epichem.dev/v1
kind: Device
metadata:
  code: DEV-ST-001
  name: Stirrer S1
  labels: {vendor: IKA, model: RCT-basic, owner: solbat}
spec:
  class: epichem.classes.Stirrer
  parent: null
  ophyd:
    import: mpifkf_devices.ika:RCTBasic
    args: {prefix: "MPIFKF:ST1:"}
  transport:
    protocol: epics-ca
    uri: "ca://MPIFKF:ST1:"
    ioc_host: ioc-bench-a.lab3.mpi-fkf.mpg.de
  network:
    primary_ip: 10.42.13.22/24
    mac: "00:1b:44:11:3a:b8"
    vlan: lab3-instruments
  location:
    lab: LAB-3
    zone: ZONE-FUMEHOOD-2
    station: SPINBOT
    # Inside the SpinBot footprint, clear of the hotplate: near corner at
    # (700,200) mm, 140x140 mm box → [700,840]x[200,340] mm.
    pose: {x_mm: 700, y_mm: 200, z_mm: 900, yaw_deg: 0}
    footprint: {size_x_mm: 140, size_y_mm: 140, size_z_mm: 120}
  capabilities:
    - stir
  envelope:
    stir_rpm: {min: 0, max: 2000}
  safety:
    flags: []
    interlocks: []
    max_unattended_minutes: 480
  operational:
    mode: read_write
    calibration: {last: "2026-03-01", due: "2026-09-01", certificate: "kadi:record/8830"}
