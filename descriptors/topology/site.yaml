apiVersion: epichem.dev/v1
kind: Site
metadata:
  code: SITE-MPIFKF
  name: MPI for Solid State Research
spec:
  address: Heisenbergstraße 1, 70569 Stuttgart, Germany
  timezone: Europe/Berlin
  # The site is itself a metric canvas (ADR 0012): labs are boxes placed on it,
  # the same width/depth/grid model as a lab, one level up.
  width_m: 24
  depth_m: 16
  grid_size_m: 1
  # A two-storey building (ADR 0013), so the Lab-layout canvas offers a floor
  # selector (the `[0]` in its breadcrumb). Labs default to floor 0; this is
  # layout-only and never appears in the containment hierarchy.
  floors: 2
