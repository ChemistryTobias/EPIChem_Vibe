# Which plans/devices each queueserver user group may see and use. EPIChem's
# palette is built from what `plans_allowed`/`devices_allowed` return for the
# group the HTTP server maps its caller to (plan §9.2), so this file is also
# what decides what a scientist can drag onto the canvas.
user_groups:
  root:  # Pre-filter for every group: nothing starting with "_" is ever exposed.
    allowed_plans:
      - null
    forbidden_plans:
      - ":^_"
    allowed_devices:
      - null
    forbidden_devices:
      - ":^_:?.*"
    allowed_functions:
      - null
    forbidden_functions:
      - ":^_"
  primary:  # The default group; the HTTP server's single-user API key maps here.
    allowed_plans:
      - ":.*"
    forbidden_plans:
      - null
    allowed_devices:
      - ":?.*:depth=3"  # devices and their subdevices, e.g. hotplate.stir_rpm
    forbidden_devices:
      - null
    allowed_functions:
      - null
    forbidden_functions:
      - null
