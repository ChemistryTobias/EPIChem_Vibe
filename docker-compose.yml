services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: epichem
      POSTGRES_PASSWORD: epichem
      POSTGRES_DB: epichem
    volumes:
      - epichem-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epichem"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://epichem:epichem@db:5432/epichem
    ports:
      - "8000:8000"
    volumes:
      - ./descriptors:/descriptors:ro
    command: >
      sh -c "epichem init-db &&
             epichem import-dir --descriptors-dir /descriptors &&
             uvicorn epichem.api.app:app --host 0.0.0.0 --port 8000"

volumes:
  epichem-db:
