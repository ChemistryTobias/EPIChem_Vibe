# EPIChem — production stack.
#
#     docker compose -f compose.prod.yaml up -d
#
# Pulls prebuilt images from the institute's GitLab registry; it does not build
# anything. That is the point: a machine running this needs Docker and network
# access to the registry, not a checkout, a toolchain, or Node.
#
# HOW THIS DIFFERS FROM compose.yaml, and why each difference exists:
#
#   * Images are pulled, not built. Deploying the exact bytes CI tested is the
#     whole argument for having a registry.
#   * No bind mounts, no --reload, no dev dependencies.
#   * Secrets have NO DEFAULTS. `${VAR:?message}` makes compose refuse to start
#     with a clear error rather than silently booting with password "epichem"
#     on a machine other people can reach. This is deliberate friction.
#   * Only the web port is published, and Postgres is not reachable from
#     outside the compose network at all.
#   * The API is served through nginx on the web container, same origin, so
#     there is still no CORS configuration anywhere.
#
# See docs/HOST_SETUP.md §3 for registry login and the deploy-token setup.

name: epichem-prod

# EPICHEM_REGISTRY is REQUIRED and has no default on purpose. The obvious
# guess for a GitLab at gitlab.gwdg.de would be registry.gitlab.gwdg.de — that
# hostname does not resolve, so the guess is wrong, and a wrong default here
# fails later and more confusingly than no default at all.
#
# Find the real value in GitLab: Deploy -> Container Registry shows the exact
# prefix to use. In CI it is the predefined $CI_REGISTRY_IMAGE, which is
# always correct and is what .gitlab-ci.yml passes in.
x-backend-image: &backend_image ${EPICHEM_REGISTRY:?set EPICHEM_REGISTRY — see Deploy > Container Registry in GitLab for the exact prefix}/backend:${EPICHEM_VERSION:-latest}
x-frontend-image: &frontend_image ${EPICHEM_REGISTRY:?set EPICHEM_REGISTRY — see Deploy > Container Registry in GitLab for the exact prefix}/frontend:${EPICHEM_VERSION:-latest}

services:
  # ------------------------------------------------------------------ db
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-epichem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — refusing to start with a default}
      POSTGRES_DB: ${POSTGRES_DB:-epichem}
    volumes:
      - db-data:/var/lib/postgresql/data
    # No `ports:`. The database is reachable only from the compose network.
    # Use `docker compose exec db psql -U epichem` for a shell on it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-epichem} -d ${POSTGRES_DB:-epichem}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ----------------------------------------------------------------- api
  # No migrate step: backend/app has no migration tool yet (deliberately —
  # see docs/PROJECT_HISTORY.md's "no Alembic yet" decision), it creates its
  # own tables on boot. No seed step either — nothing writes example data
  # into a fresh deployment yet; see the Roadmap's CLI section for the
  # planned approach (seed via real API calls, not a direct DB write).
  api:
    image: *backend_image
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-epichem}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-epichem}
    # No published port: nginx on the web service is the only way in.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ----------------------------------------------------------------- web
  # NOTE: frontend/ still targets the old backend's API shape (envelope
  # bodies, full-replace PUT) — Roadmap milestone 0.3 repoints it at
  # backend/app/. Until that lands, this stack boots but the console will
  # not work against api's actual endpoints.
  web:
    image: *frontend_image
    depends_on:
      api:
        condition: service_healthy
    environment:
      EPICHEM_API_UPSTREAM: http://api:8000
    ports:
      # Plain HTTP. Put this behind the institute's reverse proxy for TLS —
      # do not expose it to the internet directly. Bind to 127.0.0.1 instead
      # of 0.0.0.0 if the proxy runs on the same host.
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  db-data:
